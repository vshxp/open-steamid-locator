# Só configuração de ferramentas. As dependências continuam em requirements.txt e
# requirements-dev.txt, que é o que o Dockerfile instala.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Torna `src` importável sem instalar o pacote.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RET",      # returns
  "PTH",      # use pathlib
  "S",        # bandit via ruff
  "ASYNC",    # armadilhas de async
  "T20",      # print esquecido
  "RUF",
]
ignore = [
  # Docstrings e mensagens do projeto são em pt-BR; RUF001/002/003 reclamam de
  # caracteres Unicode ambíguos que aqui são apenas acentuação legítima.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` e `Query(...)` em default de argumento é *a* forma idiomática do
# FastAPI — B008 existe para defaults mutáveis acidentais, não para isto.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# São CLIs cuja saída em stdout É o produto: alimentam o resumo do CI por pipe.
# T201 existe para pegar print de depuração esquecido em biblioteca.
"scripts/*" = ["T201"]
"tests/*" = [
  "S101",  # assert é a ferramenta do pytest
  "S105",  # "chave" hardcoded nos testes é falsa, de propósito
  "S106",
  "S608",  # EXPLAIN QUERY PLAN montado no teste, sem entrada de usuário
  "SLF001",  # testes chamam _metodos internos deliberadamente
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
# B608 (SQL por concatenação) é coberto pelo S608 do ruff, que está ativo e tem
# supressão justificada em cada um dos quatro sites de src/db.py. Mantê-lo aqui
# duplicaria o alerta exigindo um segundo comentário por linha, com regras de
# posicionamento diferentes para string multilinha.
skips = ["B608"]
