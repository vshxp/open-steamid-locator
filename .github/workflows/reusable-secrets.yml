# Varredura de segredos em todo o histórico, não só no diff.
#
# Um segredo commitado e depois removido continua acessível em qualquer clone —
# por isso fetch-depth: 0. O .env deste projeto nunca foi versionado, e este job
# existe para que continue assim.
name: reusable / secrets

on:
  workflow_call:
    outputs:
      vazamentos:
        description: Quantidade de segredos detectados pelo gitleaks.
        value: ${{ jobs.gitleaks.outputs.vazamentos }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vazamentos: ${{ steps.resumir.outputs.total }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: segredo removido num commit posterior ainda está lá.
          fetch-depth: 0

      # Roda o binário oficial via container, sem depender da action (que exige
      # licença para organizações) e com a versão pinada.
      - name: Executar o gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks.json \
            --redact --verbose

      - name: Resumir
        id: resumir
        if: always()
        run: |
          if [ ! -f gitleaks.json ]; then
            # Sem relatório: o gitleaks não rodou até o fim. Fail-closed.
            echo "total=inconclusivo" >> "$GITHUB_OUTPUT"
            {
              echo "### Segredos — gitleaks"
              echo
              echo "> **Varredura inconclusiva**: nenhum relatório foi gerado."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(python3 -c 'import json;d=json.load(open("gitleaks.json"));print(len(d) if isinstance(d,list) else 0)')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo "### Segredos — gitleaks"
            echo
            if [ "$total" -eq 0 ]; then
              echo "Nenhum segredo detectado em todo o histórico."
            else
              echo "**$total achado(s).** Valores redigidos no relatório."
              echo
              echo "Um segredo que já foi commitado precisa ser **revogado**, não só removido:"
              echo "ele permanece em qualquer clone e no histórico do GitHub."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segredos-gitleaks
          path: gitleaks.json
          retention-days: 14
          if-no-files-found: warn

      - name: Falhar se houver vazamento
        if: always() && steps.resumir.outputs.total != '0'
        run: |
          echo "gitleaks: ${{ steps.resumir.outputs.total }}" >&2
          exit 1
