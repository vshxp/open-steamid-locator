services:
  app:
    build:
      context: .
      target: dev
    image: open-steamid-locator:dev
    container_name: open-steamid-locator
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # hot-reload: código do host reflete no container sem rebuild
      - ./src:/app/src
      # para rodar a suíte de dentro: docker compose exec app pytest
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Volume nomeado, não bind mount: o cache sobrevive à recriação do
      # container e não deixa arquivos root-owned no repositório do host.
      - avatar-cache:/app/cache
      # Volume separado do cache: cache é descartável, isto é dado.
      - perfil-data:/app/data
    # Sem bloco healthcheck: o definido no Dockerfile é herdado, e uma única
    # definição evita as duas divergirem.
    restart: unless-stopped

volumes:
  avatar-cache:
  perfil-data:
